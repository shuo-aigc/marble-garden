<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#75af58">
<title>弹珠花园 · 单人关卡挑战</title>
<style>
:root{--paper:#fafaf7;--ink:#171717;--line:#d9e5e2;--teal:#176866;--red:#ef533b}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;background:var(--paper);color:var(--ink);font:14px ui-monospace,monospace;overflow:hidden}
input,textarea,select{-webkit-user-select:auto;user-select:auto}
body:before{content:"";position:fixed;inset:0;opacity:.35;pointer-events:none;background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px;z-index:0}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}
.board{position:relative;overflow:hidden;width:100vw;height:100vh;height:100dvh;background:#fafaf7}
.board:before{content:"";position:absolute;inset:0;background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.board:after{content:"";position:absolute;left:50%;top:53.68%;width:55.88%;height:55.88%;margin-left:-27.94%;margin-top:-27.94%;border:2px solid var(--teal);border-radius:50%;opacity:.62;pointer-events:none}
canvas{position:relative;z-index:1;display:block;width:100%;height:auto;touch-action:none}
#webgl{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#game{position:absolute;inset:0;width:100%;height:100%;z-index:3;background:transparent}
.fallback-note{position:absolute;z-index:4;left:18px;right:18px;top:50%;transform:translateY(-50%);text-align:center;color:#555;font-size:10px;pointer-events:none}
.fallback-note strong{display:block;margin-bottom:8px;color:#171717;font:bold 15px Arial}
.hint{position:fixed;z-index:5;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#8a8a8a;font-size:11px;pointer-events:none;opacity:.85;transition:opacity .6s ease}
.hint.faded{opacity:0}

/* ---- floating chrome: everything sits ABOVE the fullscreen board as small,
   self-contained pieces instead of docked bars, so the board itself reads as the
   whole page rather than a viewport squeezed between panels. ---- */
.card{pointer-events:auto;background:rgba(250,250,247,.94);backdrop-filter:blur(6px);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
button{border:1px solid var(--ink);padding:8px 10px;background:#fff9;color:var(--ink);font:12px ui-monospace;cursor:pointer;border-radius:4px;touch-action:manipulation}
button:hover{background:var(--ink);color:#fff}
button.active{background:var(--ink);color:#fff}

.mode-pill{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:15;display:flex;gap:4px;padding:4px;border-radius:12px}

.quick-actions{position:fixed;top:calc(16px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));z-index:15;display:flex;gap:2px;padding:4px;border-radius:12px}
.quick-actions a{color:#666;text-decoration:none;padding:7px;border-radius:8px;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
.quick-actions a:hover{background:rgba(23,104,102,.12);color:var(--ink)}
.mode-pill button{border:none;background:transparent;border-radius:8px;padding:8px 14px}
.mode-pill button:hover{background:rgba(23,104,102,.12);color:var(--ink)}
.mode-pill button.active{background:var(--teal);color:#fff}

.shots-badge{position:fixed;z-index:15;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:5px 12px;font-size:11px;color:var(--teal);font-weight:400;border-radius:20px}
.level-badge{position:fixed;z-index:15;top:calc(64px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));padding:6px 11px;font-size:10px;color:var(--ink);font-weight:400;border-radius:20px}

.toast{position:fixed;z-index:15;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,8px);padding:9px 18px;font-size:12px;opacity:0;transition:opacity .25s ease,transform .25s ease;pointer-events:none;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.duel-status{position:fixed;z-index:18;top:calc(104px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;min-width:242px;padding:8px 14px 9px;text-align:center;background:#fffdf4;border:3px solid #244b43;border-radius:18px 18px 23px 23px;box-shadow:0 4px 0 #244b43,0 9px 19px rgba(26,72,61,.17);font:700 12px Georgia,serif;color:#244b43;letter-spacing:.04em}.duel-status::before,.duel-status::after{content:'✦';position:absolute;top:-11px;color:#f2ad42;font-size:15px}.duel-status::before{left:12px}.duel-status::after{right:12px}.duel-status small{display:block;margin-top:3px;color:#6b786a;font:10px ui-monospace,monospace;letter-spacing:.08em}.duel-status.show{display:block;animation:duelPop .32s cubic-bezier(.2,1.4,.4,1)}@keyframes duelPop{from{opacity:0;transform:translate(-50%,-12px) scale(.84)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.duel-result-card{position:relative;overflow:hidden;padding:28px 28px 24px!important;max-width:310px!important;border:4px solid #244b43!important;border-radius:32px 32px 44px 44px!important;background:#fff9e8!important;box-shadow:0 7px 0 #244b43,0 18px 34px rgba(0,0,0,.25)!important}.duel-result-card::before{content:'';position:absolute;inset:8px;border:2px dashed #e4a447;border-radius:24px 24px 35px 35px;pointer-events:none}.duel-result-card>*{position:relative}.duel-result-icon{font-size:46px;line-height:1;margin:0 0 7px}.duel-result-card h2{font:800 25px Georgia,serif!important;color:#244b43!important;letter-spacing:.03em!important}.duel-result-score{margin:12px 0!important;padding:10px!important;border-radius:16px;background:#d9efe4!important;color:#244b43!important;font:800 18px ui-monospace,monospace!important;letter-spacing:.08em!important}.duel-result-card p{font:600 12px Georgia,serif!important;color:#52675e!important}.duel-result-card button{border:2px solid #244b43!important;border-radius:15px!important;background:#f2ad42!important;color:#244b43!important;font-weight:800!important;box-shadow:0 3px 0 #244b43!important}
.entry-screen,.room-lobby{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;background:rgba(250,250,247,.82);backdrop-filter:blur(14px)}.entry-screen[hidden],.room-lobby[hidden]{display:none}.entry-card,.lobby-card{width:min(440px,100%);padding:28px;text-align:center}.entry-card h1,.lobby-card h2{margin:0;font:bold 28px Arial;letter-spacing:-.08em}.entry-card p,.lobby-card p{color:#666;line-height:1.7}.entry-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.entry-choices button,.lobby-card button{min-height:58px;text-align:left}.entry-choices small{display:block;color:#777;margin-top:4px}.lobby-code{margin:18px 0 8px;font:bold 34px ui-monospace;letter-spacing:.12em;color:var(--teal)}.lobby-actions{display:grid;gap:8px;margin-top:20px}.lobby-note{font-size:11px;color:#777}

#ui-toggle{position:fixed;top:calc(16px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));z-index:41;border:none;background:rgba(250,250,247,.94);color:var(--ink);font-size:16px;line-height:1;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.12);touch-action:manipulation;transition:transform .2s ease}
#ui-toggle:hover{background:var(--ink);color:#fff}
#ui-toggle:active{transform:scale(.92)}
.quick-actions,.mode-pill,#ui-toggle{transition:opacity .2s ease,transform .24s ease}
body.mobile-chrome-clear .quick-actions,body.mobile-chrome-clear .mode-pill,body.mobile-chrome-clear #ui-toggle{opacity:0;pointer-events:none}
body.mobile-chrome-clear .quick-actions,body.mobile-chrome-clear #ui-toggle{transform:translateY(-12px)}

/* The settings/inspect/restart panel: hidden off-screen by default on EVERY device
   (not just mobile, like the old HUD) — the point of "fullscreen by default" is that
   nobody sees a wall of controls until they deliberately ask for it via the corner
   button. Sliding rather than disappearing is what keeps it feeling like a real panel
   you summon, not a layout that randomly reflows. */
.panel{position:fixed;top:0;right:0;bottom:0;width:300px;max-width:88vw;z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(72px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));background:rgba(250,250,247,.97);backdrop-filter:blur(14px);box-shadow:-10px 0 30px rgba(0,0,0,.14);transform:translateX(0);transition:transform .32s cubic-bezier(.16,1,.3,1)}
.panel.ui-hidden{transform:translateX(105%)}
.panel-brand{font:bold 17px Arial;letter-spacing:-.06em;margin-bottom:4px}
.panel-brand small{display:block;font:11px ui-monospace;color:#888;letter-spacing:.02em;margin-top:2px}
.nav{display:flex;gap:14px;color:#666;font-size:11px;margin:14px 0 18px}
.nav a{color:inherit;text-decoration:none;touch-action:manipulation}
.panel section{border-top:1px solid #d7d7d2;padding:14px 0}
.panel section:first-child{border-top:none;padding-top:0}
.panel h3{margin:0 0 8px;color:var(--ink);font-weight:400;font-size:11px;letter-spacing:.08em}
.panel p{line-height:1.7;margin:4px 0;color:#666;font-size:12px}
.panel-actions{display:flex;flex-direction:column;gap:6px}
.panel-actions button{width:100%;text-align:left}
.list{display:grid;gap:8px}.list span{display:flex;justify-content:space-between}.list b{font-weight:400;color:var(--ink)}

.clear-modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(20,27,29,.55);backdrop-filter:blur(2px)}
.clear-modal[hidden]{display:none}
.clear-modal-card{padding:28px 32px;text-align:center;max-width:280px}
.clear-modal-card h2{margin:0 0 10px;font:14px ui-monospace,monospace;color:var(--ink);letter-spacing:.04em}
.clear-modal-card p{margin:0 0 18px;font-size:11px;color:#555;line-height:1.6}
.clear-modal-card button{width:100%}
.modal-actions{display:grid;gap:8px}
.level-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:54vh;overflow:auto;margin:16px 0}
.level-grid button{min-height:52px;text-align:left;padding:9px}
.level-grid button small{display:block;margin-top:3px;color:#777;font-size:9px}
.level-grid button:disabled{opacity:.38;cursor:not-allowed}
.level-grid button.current{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}

@media(max-width:520px){
  .panel{width:auto;max-width:none;left:0}
  .quick-actions{top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));gap:0;padding:3px}
  .quick-actions a{width:42px;height:42px;padding:9px}
  #ui-toggle{top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
  .mode-pill{top:calc(64px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));transform:none;width:auto;gap:3px;padding:3px}
  .mode-pill button{flex:1;padding:9px 8px;white-space:nowrap}
  .level-badge{top:calc(120px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));max-width:58vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .shots-badge{top:calc(120px + env(safe-area-inset-top));left:auto;right:calc(10px + env(safe-area-inset-right));transform:none}
}
@media(pointer:coarse){
  button{padding:12px 14px;font-size:11px;min-height:44px}
  .nav a{padding:8px 4px;display:inline-block;min-height:32px}
  #ui-toggle{width:46px;height:46px}
  select{min-height:40px;font-size:12px}
  input[type=range]{height:28px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--teal);cursor:pointer;margin-top:-9px}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--teal);border:none;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#d9e5e2}
  input[type=color]{min-height:32px;min-width:40px}
  input[type=number]{min-height:32px;padding:4px 6px}
}
.inspector{position:fixed;inset:0;z-index:50;background:#141b1d}
.inspector[hidden]{display:none}
#inspector-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.inspector-hud{position:fixed;top:calc(16px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));right:calc(16px + env(safe-area-inset-right));display:flex;justify-content:space-between}
.inspector-hint{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#cfe6e4;font:10px ui-monospace,monospace}

/* Refined tabletop pass: quiet materials, a single visual hierarchy, no sticker UI. */
:root{--paper:#f3ecd9;--ink:#283832;--line:#b8ad92;--teal:#285c4d;--red:#a44a3f;--wood:#9a5b3c;--wood-dark:#573124;--leaf:#285c4d;--sun:#c8a45d}

let rollSampleBuffer=null,rollSampleLoading=false;
function loadRollSample(ctx){
  if(rollSampleBuffer||rollSampleLoading)return;
  rollSampleLoading=true;
  try{
    const bin=atob(ROLL_SAMPLE_B64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    ctx.decodeAudioData(bytes.buffer).then(decoded=>{
      rollSampleBuffer=decoded;rollSampleLoading=false;
    }).catch(e=>{rollSampleLoading=false;console.warn("roll sample decode failed",e)});
  }catch(e){rollSampleLoading=false;console.warn("roll sample load failed",e)}
}
let masterGain=null,muted=safeStorage.get('marble-muted')==='1';
function ensureAudio(){
  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    // One master volume knob every sound routes through instead of `ctx.destination`
    // directly, so muting is a single gain flip rather than needing to track down and
    // silence every individual synth/sample node.
    masterGain=audioCtx.createGain();masterGain.gain.value=muted?0:1;
    masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended')audioCtx.resume();
  loadRollSample(audioCtx);
  return audioCtx;
}

function setMuted(v){
  muted=v;safeStorage.set('marble-muted',v?'1':'0');
  if(masterGain)masterGain.gain.setTargetAtTime(v?0:1,audioCtx.currentTime,.05);
  const btn=document.getElementById('mute-toggle');
  if(btn)btn.innerHTML=v?ICON_MUTE:ICON_VOLUME;
}
let noiseBufferCache=null;
function getNoiseBuffer(ctx){
  if(noiseBufferCache)return noiseBufferCache;
  const len=Math.floor(ctx.sampleRate*.05);
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=Math.random()*2-1;
  noiseBufferCache=buf;
  return buf;

// ---- real ray-traced caustics ----
// This is genuine geometric optics, not a hand-drawn approximation: for a grid of
// parallel rays (the light is a directional/parallel light) we actually intersect the
// sphere, bend the ray with Snell's law entering the glass, find where it exits the far
// side, bend it again leaving the glass (checking for total internal reflection, which
// really does happen and really does mean that ray contributes nothing), then continue
// the ray to the ground plane and record where it lands. Do that for a couple thousand
// rays and you get a real density map of where the light actually converges — the same
// grid pattern you'd see if you traced it by hand with a ruler and Snell's law table.
//
// The one simplification: this only needs to be computed ONCE per (ior, ball-radius)
// combination, not every frame. The light is directional (parallel rays) and the ball
// only ever translates across a flat ground plane — it never tilts or changes shape —
// so the *pattern* of where light focuses is identical no matter where the ball currently
// sits; only its on-screen position changes, and that part we already handle by moving
// the decal with the ball exactly like the shadows.

    const origin=vadd(vadd(vscale(lightDir,-startDist),vscale(u,i*radius)),vscale(v,j*radius));

    // sphere solves t*(t+2*dot(entry,refr1))=0 — the nonzero root is the exit distance
    const tExit=-2*vdot(entry,refr1);

// and composite the three resulting density maps directly into the R/G/B channels of
// one texture. Where all three overlap it reads white (like the un-dispersed center of

}

function makeBackgroundTexture(){

// A real "cat's-eye" cane is a FLAT tapered blade suspended inside the glass — wide like
// a petal face-on, a thin line edge-on — not a round tube (a round tube looks the same
// rope-like shape from every angle). So instead of TubeGeometry we build a flat strip by
// hand: a centerline running straight through the marble, offset left/right by a width
// that tapers to a point at both ends (wide in the middle, like a leaf/flame/ribbon),

  if(inspectorMarble){inspectorScene.remove(inspectorMarble.group);inspectorMarble.group.traverse(o=>{if(o.material&&o.material.normalMap)o.material.normalMap.dispose();if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()})}
  const colors=inspectorColorIndex<0?['#19a88b','#2c70d0']:palettes[inspectorColorIndex%palettes.length];
  inspectorMarble=buildMarbleCore({r:110,seed:Math.random()*10,colors});
  inspectorScene.add(inspectorMarble.group);
}
function initInspector(){
  const canvas=document.getElementById('inspector-canvas');
  inspectorRenderer=new THREE.WebGLRenderer({canvas,antialias:!isCoarsePointer});
  inspectorRenderer.outputColorSpace=THREE.SRGBColorSpace;
  inspectorRenderer.toneMapping=THREE.ACESFilmicToneMapping;
  inspectorRenderer.toneMappingExposure=params.exposure;
  inspectorScene=new THREE.Scene();
  inspectorScene.background=new THREE.Color(0x141b1d);
  inspectorCamera=new THREE.PerspectiveCamera(45,1,1,2000);
  inspectorCamera.position.set(0,0,340);
  applyEnv(inspectorRenderer,inspectorScene);
  inspectorScene.add(new THREE.HemisphereLight(0xeafcfa,0x8fd9d2,1.1));
  const dl=new THREE.DirectionalLight(0xffffff,.3);
  dl.position.set(...lightPos3());
  inspectorScene.add(dl);
  inspectorControls=new OrbitControls(inspectorCamera,canvas);
  inspectorControls.enableDamping=true;
  inspectorControls.minDistance=140;inspectorControls.maxDistance=900;
  rebuildInspectorMarble();
}
function resizeInspector(){
  if(!inspectorRenderer)return;
  const rect=document.getElementById('inspector-canvas').getBoundingClientRect();
  if(rect.width<=0||rect.height<=0)return;
  inspectorRenderer.setPixelRatio(Math.min(isCoarsePointer?1:1.5,window.devicePixelRatio||1));
  inspectorRenderer.setSize(rect.width,rect.height,false);
  inspectorCamera.aspect=rect.width/rect.height;
  inspectorCamera.updateProjectionMatrix();
}
function openInspector(){
  // show the overlay FIRST so the canvas has a real, non-zero size before the renderer
  // and OrbitControls attach to it — creating them while the element is still `hidden`
  // (0×0) can leave things in a broken state
  document.getElementById('inspector').hidden=false;
  inspectorOpen=true;
  if(!inspectorRenderer){
    try{initInspector()}
    catch(error){
      console.warn(error);
      const el=document.createElement('div');
      el.id='inspector-error';
      el.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;font:12px ui-monospace,monospace;background:#141b1d;z-index:1';
      el.innerHTML='细节查看初始化失败：'+String(error.message||error)+'<br><br><button id="inspector-close-err" type="button">✕ 返回游戏</button>';
      document.getElementById('inspector').appendChild(el);
      document.getElementById('inspector-close-err').onclick=closeInspector;
      return;
    }
  }
  resizeInspector();
}
function closeInspector(){
  document.getElementById('inspector').hidden=true;
  inspectorOpen=false;
  document.getElementById('inspector-error')?.remove();
}

function syncMeshes(){
  const all=[...balls,shooter].filter(Boolean);
  for(const[obj,m]of[...meshes])if(!all.includes(obj)){disposeMesh(m);meshes.delete(obj)}
  // rotate every hand-tuned screen-space offset (shadow layers, manual caustic nudge)
  // by however far the global light has been turned from its authoring angle, so they
  // always stay on the side opposite the light. Math is done in three-coords (y up):
  // a screen offset (ox right, oy down) is the vector (ox, -oy) here.
  const ld=lightDelta(),cosD=Math.cos(ld),sinD=Math.sin(ld);
  const rot=(ox,oy)=>{const mx=ox,my=-oy;return[mx*cosD-my*sinD,mx*sinD+my*cosD]};
  for(const b of all){
    let m=meshes.get(b);
    if(!m){m=buildMarbleMesh(b);meshes.set(b,m)}
    const tx=toThreeX(b.x),ty=toThreeY(b.y);
    // Fake-perspective drop-in: the orthographic camera can't actually make a marble
    // look bigger as it nears the camera, so we cheat the same cue every top-down game
    // uses — scale it up while "high" and settle to 1× on landing — plus a small
    // forward Z push (harmless: shadow/caustic planes sit further back at z<=-.5).
    // Deliberately NO squash/stretch here: glass is rigid, and a squashing sphere reads
    // as a soft rubber ball bouncing, not a hard marble — real glass marbles keep their
    // shape through a bounce, the "give" happens at a scale far too small to see. The
    // realism has to come entirely from the motion (gravity/bounce timing), not the shape.
    const h=Math.min(b.dropHeight,500);
    const dropScale=visualRadius(b)/b.r; // same formula physics() uses to keep marbles from overlapping while puffed up
    m.group.position.set(tx,ty,h*.5);
    m.group.scale.setScalar(dropScale);
    m.group.quaternion.set(b.quat3[0],b.quat3[1],b.quat3[2],b.quat3[3]);
    // shadow fades faint+large while the marble is still up in the air, then sharpens
    // and darkens toward its normal look right as it touches down — the same "contact
    // shadow" cue real dropped objects give away before you even see them land.
    const shadowGrow=1+h*.0025,shadowFade=1/(1+h*.006);
    m.shadowMeshes.forEach((mesh,i)=>{
      const L=shadowLayers[i];
      if(!L)return;
      const rad=b.r+L.spread;
      // +ox moves right on screen (x isn't flipped); -oy moves DOWN on screen, matching
      // the usual "positive Y = shadow below the object" convention like Figma/CSS.
      const[sx,sy]=rot(L.ox,L.oy);
      mesh.position.set(tx+sx,ty+sy,-1-i*.05);
      mesh.scale.set(rad*shadowGrow,rad*shadowGrow,1);
      mesh.material.opacity=L.opacity*shadowFade;
    });
    // causticBake.cx/cy/extent come from the actual ray-traced simulation (where the
    // light really lands, and how big that patch is) — causticOx/Oy/Size are just a
    // manual fine-tune layered on top, not the primary source of truth anymore.
    const baseCx=causticBake?causticBake.cx:0,baseCy=causticBake?causticBake.cy:0;
    const baseExtent=causticBake?causticBake.extent:b.r;
    const[cxr,cyr]=rot(params.causticOx,params.causticOy);
    // A real caustic is a TIGHT focus — it only exists at all within a narrow height
    // window just above the ground, and collapses to nothing well before the ball is
    // meaningfully "up in the air". Fading it with the same smooth curve as the broad
    // contact shadow made it read as a big glowing halo that's still clearly visible
    // (and drifting) while the ball is high up, which looks like a mistake rather than
    // optics. So: hard near-ground window (NEAR_H units), cubic falloff inside it,
    // and completely invisible (skip building the drift/scale math at all) beyond that.
    const NEAR_H=70;
    const nearT=Math.max(0,1-h/NEAR_H); // 1 at ground, 0 at/after NEAR_H, negative clamped
    const causticVis=nearT*nearT*nearT;
    if(causticVis<=0.001){
      m.causticMesh.material.opacity=0;
    }else{
      const lp=lightPos3(),invLz=1/-lp[2];
      const driftX=Math.min(h,NEAR_H)*lp[0]*invLz*.5,driftY=Math.min(h,NEAR_H)*lp[1]*invLz*.5;
      const causticRad=baseExtent*params.causticSize*(1+(1-nearT)*.5);
      m.causticMesh.position.set(tx+baseCx+cxr+driftX,ty+baseCy+cyr+driftY,-.5);
      m.causticMesh.scale.set(causticRad,causticRad,1);
      m.causticMesh.material.opacity=params.causticIntensity*causticVis;
    }
    // in FRONT of the sphere (h*.5 is the sphere's own world z), not behind it like the
    // caustic/shadow patches — see the comment above getRainbowTexture() for why
    m.rainbowMesh.position.set(tx,ty,h*.5+b.r*1.2);
    m.rainbowMesh.scale.set(visualRadius(b)*1.06,visualRadius(b)*1.06,1);
    m.rainbowMesh.material.opacity=params.iridescence;
    // internal color flecks: angle is offset by the marble's own rolling accumulator
    // (`rot`, the same one the ribbons use) so they visibly drift across the face as it
    // actually rolls and sit still when it's still — see getFleckTexture()'s comment.
    const vr=visualRadius(b);
    for(let fi=0;fi<m.flecks.length;fi++){
      const fleck=m.flecks[fi];
      const fseed=b.seed*11.3+fi*17.7;
      const baseAngle=(fseed*2.4)%(Math.PI*2);
      const angle=baseAngle+b.rot*.7;
      const distFrac=.32+((fseed*3.7)%1)*.28; // 0.32-0.6 of the visible radius from center
      fleck.position.set(tx+Math.cos(angle)*vr*distFrac,ty+Math.sin(angle)*vr*distFrac,h*.5+b.r*1.2);
      fleck.scale.set(vr*(.34+((fseed*5.1)%1)*.22),vr*(.34+((fseed*5.1)%1)*.22),1);
      fleck.material.color.setHSL((fseed*.618)%1,.55,.78);
      fleck.material.opacity=params.iridescence*.4;
    }
  }
  syncContactAO(all);
}

// ---- inter-marble contact occlusion + neighbor color bleed ----
// When two marbles sit close together, real light gets trapped in the pinch between
// them and the table darkens there (ambient occlusion). Without it, marbles in a
// cluster look like independent cut-outs pasted next to each other.
//
// This is TWO pooled layers, not one, to get a real near-sharp/far-blur read instead
// of one fixed-softness blob fading in and out:
//  - a wide, soft "halo" that's the first thing to appear as marbles enter range —
//    present-but-blurry, like a shadow that hasn't come into focus yet
//  - a small, dark "core" that only switches on in roughly the closest 40% of the
//    range, tightening further as the gap closes to zero — the "in focus" contact
//  Both also fade with the taller of the two marbles' hover height instead of hard
//  cutting off above dropHeight>1 like before: a marble held in your hand (the pickup
//  hover) still casts a dim, soft contact shadow near a neighbor, it just isn't fully
//  "landed" — only a real throw arcing well above the table fades it out completely.
//
// The SAME proximity scan also drives a second, "color bleed" tint on each marble's
// near-facing side, tinted with its neighbor's color — real translucent objects softly
// tint each other where they're close, the way two pieces of colored glass touching do;
// positioned just behind the glass shell so the transmission render picks it up as part
// of what's "seen through" that side of the marble (same trick the caustic patch uses).
let coreTexCache=null,coreAoPool=[];
let haloTexCache=null,haloAoPool=[];
let tintTexCache=null,tintPool=[];
function getCoreAoTexture(){
  if(coreTexCache)return coreTexCache;
  const s=128,c=document.createElement('canvas');c.width=c.height=s;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(0,0,0,.95)');
  g.addColorStop(.35,'rgba(0,0,0,.7)');
  g.addColorStop(.65,'rgba(0,0,0,.28)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,s,s);
  coreTexCache=new THREE.CanvasTexture(c);
  return coreTexCache;
}
function getHaloAoTexture(){
  if(haloTexCache)return haloTexCache;
  const s=128,c=document.createElement('canvas');c.width=c.height=s;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(0,0,0,.35)');
  g.addColorStop(.5,'rgba(0,0,0,.16)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,s,s);
  haloTexCache=new THREE.CanvasTexture(c);
  return haloTexCache;
}
function getTintTexture(){
  if(tintTexCache)return tintTexCache;
  const s=128,c=document.createElement('canvas');c.width=c.height=s;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  // This is a FLAT circular disc glued in front of a CURVED glass surface — no matter
  // how soft the fade, the disc still has an actual geometric boundary that doesn't
  // follow the sphere's curvature, and any spot where opacity is still perceptibly
  // above zero right up to that boundary reads as a seam/ring cutting across the
  // rounded ball (exactly the reported hard edge). The fix isn't a softer edge, it's
  // no edge to see in the first place: opacity has to reach effectively-zero (not just
  // "trending toward" zero) well BEFORE the geometry's actual boundary, so wherever
  // that boundary technically sits is already outside the visible glow entirely.
  // A flat, evenly-lit haze is what reads as "a painted circle" — real light
  // concentrating in through a curved surface has a small brighter core (where the
  // most light actually makes it through) and a much longer, fainter tail, the same
  // "hot center + soft spread" shape a real glint or a caustic patch has, not a
  // uniform blob with one falloff rate.
  g.addColorStop(0,'rgba(255,255,255,.85)');
  g.addColorStop(.18,'rgba(255,255,255,.5)');
  g.addColorStop(.4,'rgba(255,255,255,.16)');
  g.addColorStop(.6,'rgba(255,255,255,.045)');
  g.addColorStop(.78,'rgba(255,255,255,.006)');
  g.addColorStop(.88,'rgba(255,255,255,0)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,s,s);
  tintTexCache=new THREE.CanvasTexture(c);
  return tintTexCache;
}
const neighborColorCache=new WeakMap(); // WeakMap so old marble objects (from restart/setup) can still be GC'd
function neighborColor(b){
  let col=neighborColorCache.get(b);
  if(!col){col=new THREE.Color(b.colors[0]).lerp(new THREE.Color(b.colors[1]),.5);neighborColorCache.set(b,col)}
  return col;
}
const poolPlaneGeo=new THREE.PlaneGeometry(2,2),poolCircleGeo=new THREE.CircleGeometry(1,32);
function getPoolMesh(pool,idx,tex,blending,circular,depthTest=true){
  let m=pool[idx];
  if(!m){
    m=new THREE.Mesh(circular?poolCircleGeo:poolPlaneGeo,new THREE.MeshBasicMaterial({map:tex,transparent:true,blending,depthWrite:false,depthTest,toneMapped:false}));
    m.renderOrder=0;
    scene.add(m);
    pool.push(m);
  }
  return m;
}
// how high (world units) a marble can hover above the table before contact effects
// with its neighbors fade out completely — comfortably above GRAB_LIFT so picking a
// marble up still shows a dim contact shadow near its neighbors, not just a hard cut
const CONTACT_HOVER_RANGE=65;
function syncContactAO(all){
  let usedCore=0,usedHalo=0,usedTint=0;
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const a=all[i],b=all[j];
    const heightK=1-Math.min(1,Math.max(a.dropHeight,b.dropHeight)/CONTACT_HOVER_RANGE);
    if(heightK<=0)continue; // properly airborne (a real throw), not just a pickup hover
    const d=distance(a,b),gap=d-a.r-b.r;
    const range=Math.min(a.r,b.r)*1.7;
    if(gap>range||d<=0)continue;
    const k=1-Math.max(0,gap)/range; // 1 when touching, 0 at max range
    // midpoint of the gap between the two surfaces, along the center line
    const tt=(a.r+Math.max(0,gap)/2)/d;
    const px=a.x+(b.x-a.x)*tt,py=a.y+(b.y-a.y)*tt;
    const ang=Math.atan2(-(b.y-a.y),b.x-a.x); // three-coords: screen dy flips sign
    const s=Math.min(a.r,b.r);

    // halo: soft, wide, eases in gently across the whole range — the "not in focus
    // yet" far read. Cubic ease keeps it from being loud while still distant.
    const haloEase=k*k*k;
    if(haloEase>0.003){
      const hm=getPoolMesh(haloAoPool,usedHalo++,getHaloAoTexture(),THREE.NormalBlending);
      hm.position.set(toThreeX(px),toThreeY(py),-.75);
      hm.rotation.z=ang;
      hm.scale.set(s*1.9,s*2.6,1);
      hm.material.opacity=.8*haloEase*heightK;
      hm.visible=true;
    }
    // core: small, dark, only switches on in the closest part of the range and keeps
    // tightening as the gap closes to zero — the "snaps into focus" near read.
    const coreT=Math.max(0,(k-.55)/.45);
    const coreEase=coreT*coreT;
    if(coreEase>0.003){
      const cm=getPoolMesh(coreAoPool,usedCore++,getCoreAoTexture(),THREE.NormalBlending);
      cm.position.set(toThreeX(px),toThreeY(py),-.8);
      cm.rotation.z=ang;
      cm.scale.set(s*(.72-.15*k),s*(1.15-.22*k),1);
      cm.material.opacity=.9*coreEase*heightK;
      cm.visible=true;
    }

    if(params.neighborTint>0){
      const nx=(b.x-a.x)/d,ny=(b.y-a.y)/d; // unit vector pointing from A toward B
      // patch on A's near side (toward B), tinted with B's color, and the mirror on B's side
      for(const[from,to,dirX,dirY]of[[b,a,nx,ny],[a,b,-nx,-ny]]){
        // depthTest must be off here: this flat disc's Z is fixed, but it's placed in
        // front of a CURVED sphere surface — at points within the disc's own footprint
        // that are closer to the ball's front pole, the sphere's surface actually
        // bulges out further than the disc's flat plane, so with normal depth testing
        // the sphere would occlude part of the disc right where its surface crosses
        // the disc's depth — a hard curved cutoff with nothing to do with the texture's
        // alpha at all (the same lesson already learned for the bubbles).
        const tm=getPoolMesh(tintPool,usedTint++,getTintTexture(),THREE.NormalBlending,true,false);
        // Pushed further out (.75r) so the patch sits near the actual silhouette edge
        // facing the neighbor, not centered over the middle of the ball — a real color
        // bleed only ever shows up right at the contact rim, not across the whole face.
        const off=to.r*.75;
        const ox=to.x+dirX*off,oy=to.y+dirY*off;
        // In front of `to`'s own sphere (not behind, like the AO shadow) — same reason
        // the rainbow billboard moved in front: transmission's background capture pass
        // doesn't respect a texture's per-pixel alpha, only the material's flat opacity.
        // BUT it was floating way out at 1.2r before — nearly half the ball's radius
        // beyond the actual glass surface (which peaks at 1.0r), with a patch almost as
        // wide as the whole ball — which is exactly what read as "a flat coin hovering
        // in front", not a tint embedded in the glass. The surface only bulges out to
        // sqrt(r²-(.75r)²)≈.66r at this off-center point, so .78r clears it with a
        // small, deliberately tight margin — hugging the curve instead of floating
        // clear of it — and the patch itself is much smaller (.4r, not 1.05r) so it
        // reads as a localized glow at the contact point, not a sticker on the whole face.
        tm.position.set(toThreeX(ox),toThreeY(oy),Math.min(to.dropHeight,500)*.5+to.r*.78);
        // A perfectly round, perfectly even glow is what reads as "a circle sitting on
        // top" — real color bleeding in through a curved surface isn't uniform: it's
        // squeezed into the pinch zone between the two balls (same reason the AO
        // contact shadow is an ellipse, not a circle) and brighter where the surfaces
        // are genuinely closest. Rotating to match the contact geometry and stretching
        // it — narrow along the line joining the two centers, wide across the pinch —
        // gives it an actual shape reason to be there instead of a generic blob.
        tm.rotation.z=ang;
        tm.scale.set(to.r*.34,to.r*.62,1);
        tm.material.color.copy(neighborColor(from));
        // linear in k (not k^1.2) and a higher floor via the slider so low slider
        // settings still read as a faint-but-visible tint instead of vanishing —
        // combined with the tighter texture above this now has real range between
        // "barely there" and "obviously tinted" instead of jumping from nothing to mush.
        // Also biased by k² on top of the linear term: right at the moment of contact
        // (k near 1) it should look like real light is genuinely passing between the
        // two touching surfaces, not just "these two happen to be somewhat close."
        tm.material.opacity=k*params.neighborTint*(.55+.45*k);
        tm.visible=true;
      }
    }
  }
  for(let i=usedCore;i<coreAoPool.length;i++)coreAoPool[i].visible=false;
  for(let i=usedHalo;i<haloAoPool.length;i++)haloAoPool[i].visible=false;
  for(let i=usedTint;i<tintPool.length;i++)tintPool[i].visible=false;
}

let bgPlaneMesh=null;
let lastRendererW=0,lastRendererH=0,overlayDpr=1;
function resizeToStage(){
  if(!renderer)return;
  const rect=webglCanvas.getBoundingClientRect();
  if(rect.width<=0||rect.height<=0)return;
  if(Math.abs(rect.width-lastRendererW)<1&&Math.abs(rect.height-lastRendererH)<1)return;
  lastRendererW=rect.width;lastRendererH=rect.height;
  // keep our render resolution from wildly exceeding what MeshPhysicalMaterial's
  // internal transmission buffer can usefully provide — pushing more physical pixels
  // than that doesn't add sharpness to the glass, it just upscales/blurs it
  const dpr=Math.min(2,window.devicePixelRatio||1);
  overlayDpr=dpr;
  renderer.setPixelRatio(dpr);
  renderer.setSize(rect.width,rect.height,false);
  updateView();
  // The 2D overlay canvas (#game, used for the aim line in Clear Table mode) sits on
  // top of the WebGL canvas and needs its own pixel buffer resized to the same extended
  // view space so a draw at table-space (x,y) lands on the exact same screen pixel as
  // the corresponding 3D-rendered marble — both canvases stretch to fill the same CSS
  // box at the same aspect ratio. Sizing the buffer at 1 canvas-px = 1 CSS-px (like the
  // first version did) is exactly the same "blurry background texture" bug fixed
  // earlier, just on this overlay canvas instead: on any retina/high-DPI screen the
  // buffer is lower-res than the screen, so the browser silently upscales/blurs
  // everything drawn onto it (the dashed aim line included). Sizing the buffer to the
  // real device pixel ratio and scaling the drawing context back down (in renderFrame)
  // keeps every draw call below using plain view-space coordinates unchanged.
  canvas.width=Math.ceil(view.w*dpr);canvas.height=Math.ceil(view.h*dpr);
  camera.left=-view.w/2;camera.right=view.w/2;camera.top=view.h/2;camera.bottom=-view.h/2;
  camera.updateProjectionMatrix();
  if(bgPlaneMesh){
    bgPlaneMesh.geometry.dispose();
    bgPlaneMesh.geometry=new THREE.PlaneGeometry(view.w,view.h);
    regenerateBackground();
  }
}

function initThree(){
  // Each marble's glass uses MeshPhysicalMaterial transmission, which makes Three.js
  // render an extra "what's behind this surface" pass per transmissive object every
  // frame — with 8 marbles on screen that's the single biggest GPU cost in this scene,
  // and it scales with renderer resolution (pixelRatio × canvas size), not geometry
  // complexity. Mobile GPUs (especially mid/low-end Android) choke on this far sooner
  // than desktop, so on coarse-pointer devices we cap pixel ratio lower and drop MSAA
  // (pixel ratio already does most of the anti-aliasing job at these sizes).
  renderer=new THREE.WebGLRenderer({canvas:webglCanvas,alpha:true,antialias:!isCoarsePointer,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  renderer.setSize(W,H,false);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=params.exposure;
  renderer.setClearColor(0x000000,0);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  scene=new THREE.Scene();
  updateView();
  // MeshPhysicalMaterial's built-in transmission (used for the glass shell) derives its
  // refraction view-direction as normalize(cameraPosition - worldPosition) — a
  // perspective assumption. Under an orthographic camera every ray should really be
  // parallel (straight down -Z), but that formula still converges toward the single
  // camera point, so marbles far from the screen center got an increasingly tilted
  // (wrong) view vector and their internal ribbon visibly drifted off-center the
  // farther out they sat. Parking the camera much farther back along Z shrinks that
  // angular error a lot (same X offset, much bigger Z) without changing the framing at
  // all — orthographic projection size depends only on left/right/top/bottom, not
  // camera distance — so this is a free fix.
  camera=new THREE.OrthographicCamera(-view.w/2,view.w/2,view.h/2,-view.h/2,1000,10000);
  camera.position.set(0,0,6000);
  camera.lookAt(0,0,0);

  updateEnvironment();

  // with the direct light turned way down (.3), the ambient fill is now doing most of the
  // work lighting the scene — bumped it up a lot and given the "ground" bounce color an
  // actual glass-teal tint (matching the glass's own attenuationColor) so shadowed areas
  // still glow with that cool glassy ambient light instead of just going flat dark
  scene.add(new THREE.HemisphereLight(0xeafcfa,0x8fd9d2,1.1));
  dirLight=new THREE.DirectionalLight(0xffffff,params.lightIntensity);
  dirLight.position.set(...lightPos3());
  // real shadow-map projection stays OFF (it was removed by request earlier — the
  // bright HDRI environment made it visibly resurface): ALL shadowing comes from the
  // artist-controlled shadow-layer stack, which is what keeps the stylized look.
  dirLight.castShadow=true;
  dirLight.shadow.intensity=.25;
  dirLight.shadow.radius=4;
  dirLight.shadow.mapSize.set(1024,1024);
  dirLight.shadow.camera.left=-380;dirLight.shadow.camera.right=380;dirLight.shadow.camera.top=380;dirLight.shadow.camera.bottom=-380;
  dirLight.shadow.camera.near=100;dirLight.shadow.camera.far=900;
  dirLight.shadow.bias=params.shadowBias;dirLight.shadow.radius=params.shadowRadius;
  scene.add(dirLight);

  bgPlaneMesh=new THREE.Mesh(new THREE.PlaneGeometry(view.w,view.h),new THREE.MeshStandardMaterial({map:makeBackgroundTexture(),roughness:1,metalness:0}));
  bgPlaneMesh.position.z=-60;
  bgPlaneMesh.receiveShadow=true;
  scene.add(bgPlaneMesh);

  shadowLayers.forEach(L=>{L.tex=bakeShadowLayerTexture(L)});
  rebakeCaustics();

  useThree=true;
  document.getElementById('fallback').hidden=true;
  webglCanvas.style.display='block';
  resizeToStage();
}

function renderFrame(){
  resizeToStage();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // Scale the drawing context to match the overlay canvas's real device-pixel-ratio
  // buffer (see resizeToStage) so every draw below can keep using plain view-space
  // coordinates — same 1-line fix pattern as the background-texture blur, applied here.
  ctx.setTransform(overlayDpr,0,0,overlayDpr,0,0);
  if(useThree){syncMeshes();renderer.render(scene,camera)}
  else{balls.forEach(glass);if(shooter)glass(shooter)}
  drawAimLine();
}

function settled(){return ![...balls,shooter].some(b=>b.grabbed||b.dropHeight>.5||Math.hypot(b.vx,b.vy)>1.2)}
async function syncLive(){if(!online.id||!online.live||online.syncing||online.busy||online.room?.turnPlayer!==online.player||performance.now()-online.lastSync<90)return;online.syncing=true;online.lastSync=performance.now();try{const r=await roomCall('sync',{roomId:online.id,state:snapshot()});acceptRoom(r.room)}catch(e){console.warn('live sync',e)}finally{online.syncing=false}}
async function submitTurn(){if(!online.id||!online.pending||online.busy||online.syncing||!settled())return;online.pending=false;online.live=false;online.busy=true;try{const cleared=Math.max(0,online.turnStartCount-balls.length),r=await roomCall('submit',{roomId:online.id,state:snapshot(),cleared});acceptRoom(r.room)}catch(e){online.pending=true;say('同步失败：'+e.message)}finally{online.busy=false}}

// Unified pick-up/roll/throw: grab whichever marble is under the pointer, follow the
// pointer exactly while held (real rolling motion via roll(), not just an aim line),
// and on release derive a throw velocity from the last ~150ms of motion — the same
// technique the old "flick" mode used. Barely-moved samples mean near-zero velocity,
// so gently setting a marble down and hard-swinging it are the same gesture, just at
// different speeds, instead of separate modes to switch between.
canvas.addEventListener('pointerdown',e=>{
  if(!running)return;
  if(!canPlayOnline())return say(roomText());
  ensureAudio(); // browsers require the AudioContext to start/resume from within a real user gesture — this is the earliest one we get
  const p=point(e);
  if(gameMode==='clear'){
    // Only the shooter is interactive here — target marbles react purely through
    // collisions, on purpose, so aiming/power stays the one deliberate input.
    if(clearGameOver||shotsLeft<=0)return;
    if(shooter&&distance(p,shooter)<shooter.r+(e.pointerType==='touch'?52:34)){
      // Taking hold of the cue marble immediately hands control back to the player.
      // It no longer has to settle almost completely before the next shot can be aimed.
      shooter.vx=0;shooter.vy=0;shooter.dropHeight=0;shooter.dropVel=0;shooter.dropDone=true;
      aiming=true;aimAnchor={x:shooter.x,y:shooter.y};aimEnd={x:p.x,y:p.y};
      canvas.setPointerCapture(e.pointerId);
    }
    return;
  }
  let best=null,bestD=Infinity;
  // no speed cap here anymore: a marble that's currently rolling can still be grabbed
  // mid-motion (picking up a moving marble is a completely normal thing to want to do),
  // and since every OTHER marble was always grabbable regardless of what this one was
  // doing, removing the restriction here is the fix for both at once.
  // touch fingertips cover a much bigger area than a mouse cursor and occlude the
  // exact contact point, so grabbing needs a noticeably larger forgiveness radius
  // on touch than on mouse/pen to feel reliable instead of "missing" the marble.
  const grabPad=e.pointerType==='touch'?46:30;
  for(const b of[...balls,shooter]){
    if(!b)continue;
    const d=distance(p,b);
    if(d<b.r+grabPad&&d<bestD){best=b;bestD=d}
  }
  if(!best)return;
  grabbed=best;grabbed.grabbed=true;grabbed.vx=0;grabbed.vy=0;grabbed.dropVel=0;grabbed.dropDone=false;
  drag=true;canvas.setPointerCapture(e.pointerId);
  dragSamples=[{x:p.x,y:p.y,t:performance.now()}];
  sayKey('msgPicked');
});
canvas.addEventListener('pointermove',e=>{
  if(aiming){
    const p=point(e);
    const MAX_PULL=180,dx=p.x-aimAnchor.x,dy=p.y-aimAnchor.y,len=Math.hypot(dx,dy);
    const k=len>MAX_PULL?MAX_PULL/len:1;
    aimEnd={x:aimAnchor.x+dx*k,y:aimAnchor.y+dy*k};
    return;
  }
  if(!drag||!grabbed)return;
  const p=point(e);
  const nx=Math.min(Math.max(p.x,-view.ox+grabbed.r),W+view.ox-grabbed.r),ny=Math.min(Math.max(p.y,-view.oy+grabbed.r),H+view.oy-grabbed.r);
  roll(grabbed,nx-grabbed.x,ny-grabbed.y);
  const now=performance.now(),prev=dragSamples[dragSamples.length-1],pdt=(now-prev.t)/1000;
  // physics()'s collision response works off vx/vy (relative velocity → bounce
  // impulse), but a grabbed marble's position is set directly here rather than
  // integrated from its velocity, so vx/vy just sat at 0 for the whole drag — which
  // meant slamming a dragged marble into another one pushed it aside (the raw overlap
  // correction still applies) but never actually "hit" it with any bounce, since the
  // impulse math saw zero relative speed. Feeding the real per-frame drag speed into
  // vx/vy fixes that: other marbles now get hit exactly as hard as you're dragging.
  if(pdt>0){grabbed.vx=(nx-grabbed.x)/pdt;grabbed.vy=(ny-grabbed.y)/pdt}
  grabbed.x=nx;grabbed.y=ny;
  dragSamples.push({x:nx,y:ny,t:now});
  dragSamples=dragSamples.filter(s=>now-s.t<150);
});
canvas.addEventListener('pointerup',()=>{
  if(aiming){
    aiming=false;
    const dx=aimEnd.x-aimAnchor.x,dy=aimEnd.y-aimAnchor.y,pull=Math.hypot(dx,dy);
    aimEnd=null;
    if(pull<10)return; // too small a pull to count as a deliberate shot
    const power=Math.min(1,pull/180),spd=power*MAX_SHOT_SPEED;
    // Shot fires in the SAME direction as the drag (point the arrow where you want the
    // ball to go, not slingshot-style reversed) — matches the arrowhead drawn on the
    // aim line pointing straight at the target direction.
    if(online.room?.players?.length===2)online.turnStartCount=balls.length;
    shooter.vx=dx/pull*spd;shooter.vy=dy/pull*spd;
    shooter.dropDone=false;shooter.dropVel=650*(1-Math.exp(-spd/220));shooter.bounceCount=0;
    shotsLeft--;updateShotsUI();
    if(online.room?.players?.length===2){online.pending=true;online.live=true}
    if(!online?.id)trackGameEvent('shot');
    sayKey('msgClearShoot');
    return;
  }
  if(!drag||!grabbed)return;
  drag=false;
  const b=grabbed;grabbed=null;b.grabbed=false;
  const now=performance.now();
  dragSamples=dragSamples.filter(s=>now-s.t<150);
  // Grabbing forces dropDone=false and eases the marble up to a small GRAB_LIFT hover
  // for as long as it's held (a purely cosmetic "picked up" cue) — but on release, that
  // meant EVERY grab/let-go, even a gentle one, fell those ~28 units and played a real
  // landing thump, since 28 units is still enough height to cross the "that was a real
  // impact" sound threshold. That's what read as "random extra drop sounds after every
  // collision": you naturally grab-drag-release marbles to bump them into each other,
  // and the release itself was quietly making its own unrelated thud each time. A
  // gentle release (no real throw) should just settle at rest with no fall to play out
  // at all — only an actual throw keeps the physical fall+bounce+sound.
  if(dragSamples.length<2){b.vx=0;b.vy=0;b.dropHeight=0;b.dropVel=0;b.dropDone=true;sayKey('msgPlaced');if(online.room?.players?.length===2)online.pending=true;return}
  const first=dragSamples[0],last=dragSamples[dragSamples.length-1];
  const dt=(last.t-first.t)/1000;
  // A plain click (press, release almost immediately, no deliberate movement) can
  // still land 2+ samples a couple of pixels apart over a genuinely tiny dt — natural
  // event-timing/cursor noise, not intent. Dividing a small distance by a very small
  // time produces a "speed" that can spuriously clear the 24 threshold on its own, so
  // a plain click got misread as a weak throw: a real (if tiny) fall+bounce+sound
  // sequence for something that was never actually thrown. Speed alone can't tell
  // "genuinely fast over a normal duration" apart from "noise over a near-zero
  // duration" — requiring a real minimum DISTANCE too (a throw gesture actually
  // travels somewhere; jitter mostly doesn't) closes that gap.
  const dist=Math.hypot(last.x-first.x,last.y-first.y);
  let vx=0,vy=0;
  if(dt>0){vx=(last.x-first.x)/dt;vy=(last.y-first.y)/dt}
  const spd=Math.hypot(vx,vy);
  if(spd>MAX_LAUNCH_SPEED){const k=MAX_LAUNCH_SPEED/spd;vx*=k;vy*=k}
  b.vx=vx;b.vy=vy;
  if(spd<24||dist<8){b.dropHeight=0;b.dropVel=0;b.dropDone=true;sayKey('msgPlaced')}
  else{
    // `spd` here is the RAW gesture speed (measured before the MAX_LAUNCH_SPEED clamp
    // above, which only limits the rolling velocity for physics stability) — so this
    // was never actually reading a capped value. The real problem was the mapping
    // itself: spd*4 hits its 720 ceiling as soon as raw spd reaches just 180, and any
    // committed "throw" gesture easily clears that — a 300px flick and an 800px flick
    // both saturate to the exact same hop, which is why every throw looked identical.
    // A saturating exponential curve instead keeps rising (with diminishing returns)
    // across the whole practical range a human gesture can produce, so weak/medium/
    // hard throws each get a visibly different hop height, and only truly absurd
    // input speeds ever approach the ceiling.
    b.dropDone=false;b.dropVel=650*(1-Math.exp(-spd/220));b.bounceCount=0;
    sayKey('msgThrown');
  }
  if(online.room?.players?.length===2){online.pending=true;online.live=true}
});

function updateModeUI(){
  document.getElementById('mode-free').classList.toggle('active',gameMode==='free');
  document.getElementById('mode-clear').classList.toggle('active',gameMode==='clear');
  document.getElementById('shuffle').style.display=gameMode==='clear'?'none':'';
  const title=document.getElementById('mode-desc-title'),body=document.getElementById('mode-desc-body');
  if(gameMode==='clear'){title.removeAttribute('data-i18n');title.textContent=t('modeClear');body.removeAttribute('data-i18n-html');body.innerHTML=t('clearDesc')}
  else{title.setAttribute('data-i18n','freePlay');title.textContent=t('freePlay');body.setAttribute('data-i18n-html','freePlayDesc');body.innerHTML=t('freePlayDesc')}
  updateShotsUI();
  updateLevelUI();
}
let mobileChromeHidden=false,mobileChromeLastActive=0;
function updateMobileChromeAvoidance(){
  if(!isMobile||gameMode!=='free'){
    mobileChromeHidden=false;mobileChromeLastActive=0;document.body.classList.remove('mobile-chrome-clear');return;
  }
  const screenH=lastRendererH||window.innerHeight||1;
  let nearest=Infinity;
  let topMarbleActive=false;
  for(const b of[...balls,shooter]){
    if(!b)continue;
    const screenY=(b.y+view.oy)/view.h*screenH;
    const screenR=b.r/view.h*screenH;
    const top=screenY-screenR;
    nearest=Math.min(nearest,top);
    // Tiny residual physics drift should count as settled. Only a marble that is
    // actually being handled or visibly rolling can temporarily clear the chrome.
    if(top<190&&(b.grabbed||Math.hypot(b.vx,b.vy)>12))topMarbleActive=true;
  }
  const now=performance.now();
  if(topMarbleActive||drag){
    mobileChromeLastActive=now;
    if(nearest<178)mobileChromeHidden=true;
  }
  // Always bring the controls back once interaction/meaningful motion has stopped,
  // even when a settled marble remains underneath the top control area.
  if(mobileChromeHidden&&!drag&&!topMarbleActive&&now-mobileChromeLastActive>520)mobileChromeHidden=false;
  document.body.classList.toggle('mobile-chrome-clear',mobileChromeHidden);
}
document.getElementById('restart').onclick=()=>{if(!canPlayOnline())return say(roomText());if(gameMode==='clear')setupClearTable();else setup();if(online.id)online.pending=true};
document.getElementById('mode-free').onclick=()=>{if(online.id)return say('双人房间固定为自由模式');setup();updateModeUI()};
document.getElementById('mode-clear').onclick=()=>{if(online.id)return say('双人房间固定为自由模式');setupClearTable();updateModeUI()};
document.getElementById('entry-clear').onclick=()=>{trackGameEvent('mode_clear_start');document.getElementById('entry-screen').hidden=true;setupClearTable(currentLevel);updateModeUI()};
document.getElementById('entry-free').onclick=()=>{trackGameEvent('mode_free_start');document.getElementById('entry-screen').hidden=true;setup();updateModeUI()};
document.getElementById('clear-modal-restart').onclick=()=>setupClearTable();
document.getElementById('clear-modal-next').onclick=()=>setupClearTable(currentLevel+1);
document.getElementById('clear-modal-levels').onclick=()=>{document.getElementById('clear-modal').hidden=true;openLevelSelect()};
document.getElementById('level-select-open').onclick=()=>openLevelSelect();
document.getElementById('level-modal-close').onclick=()=>{document.getElementById('level-modal').hidden=true};
document.getElementById('shuffle').onclick=()=>{balls.forEach(b=>{b.x=270+Math.random()*140;b.y=245+Math.random()*160;b.vx=b.vy=0});if(shooter){shooter.x=340;shooter.y=630;shooter.vx=shooter.vy=0}sayKey('msgShuffled')};
document.getElementById('pause').onclick=e=>{e.preventDefault();running=!running;document.getElementById('pause').innerHTML=running?ICON_PAUSE:ICON_PLAY;sayKey(running?'msgResumed':'msgPaused')};
document.getElementById('help').onclick=e=>{e.preventDefault();sayKey('helpFree')};
document.getElementById('ui-toggle').onclick=()=>{document.getElementById('hud').classList.toggle('ui-hidden')};
canvas.addEventListener('pointerdown',()=>document.getElementById('hint').classList.add('faded'),{once:true});
document.getElementById('inspect-toggle').onclick=()=>openInspector();
document.getElementById('inspector-close').onclick=()=>closeInspector();
document.getElementById('inspector-color').onclick=()=>{inspectorColorIndex++;rebuildInspectorMarble()};
document.getElementById('lang-toggle').onclick=e=>{e.preventDefault();setLanguage(currentLang==='zh'?'en':'zh')};
document.getElementById('mute-toggle').onclick=e=>{e.preventDefault();setMuted(!muted)};
document.getElementById('mute-toggle').innerHTML=muted?ICON_MUTE:ICON_VOLUME;

window.addEventListener('resize',resizeToStage);
window.addEventListener('resize',resizeInspector);
// 'resize' alone can be sluggish/unreliable on mobile when the address bar
// shows/hides or the device rotates (iOS Safari in particular); orientationchange
// and visualViewport's own resize event catch cases plain 'resize' sometimes misses.
window.addEventListener('orientationchange',()=>{resizeToStage();resizeInspector()});
if(window.visualViewport){visualViewport.addEventListener('resize',()=>{resizeToStage();resizeInspector()})}

applyTranslations();
try{initThree()}catch(error){console.warn(error);useThree=false;document.getElementById('fallback').hidden=false;document.getElementById('fallback').innerHTML='<strong>WebGL 初始化失败</strong><span style="font-size:9px">'+String(error.message||error)+'</span>';webglCanvas.style.display='none'}
installSizeControl();installCountControl();installShadowLayerPanel();installTuningPanel();setupClearTable();updateModeUI();
setDevMode(devMode); // re-applies in case the panels were just (re)built above
console.log('%cCtrl+Shift+D toggles the render-debug panel','color:#176866');
// On phones the always-on HUD (info panel + the ~20-slider render-tuning panel) eats
// most of the usable width and — since .card has pointer-events:auto — physically
// blocks dragging any marble that renders underneath it. Default to the clean,
// fully-interactive board on touch/small screens; the existing "☰ UI" button still
// opens the HUD on demand for anyone who wants the panels.
if(isMobile)document.getElementById('hud').classList.add('ui-hidden');
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  updateMobileChromeAvoidance();
  if(!inspectorOpen){acc+=dt;while(acc>=1/120){physics(1/120);acc-=1/120}[...balls,shooter].forEach(b=>{updateDrop(b,dt);updateRollSound(b)});if(gameMode==='clear'){checkRingExit();updateShards(dt);if(!online.id&&!clearGameOver&&shotsLeft<=0&&balls.length>0&&allClearBallsSettled())showClearResult(false)}renderFrame();submitTurn();syncLive()}
  if(inspectorOpen&&inspectorRenderer){inspectorControls.update();inspectorRenderer.render(inspectorScene,inspectorCamera)}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
